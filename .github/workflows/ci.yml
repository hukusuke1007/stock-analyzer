name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # バージョンは package.json の packageManager に従う
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Node のサーバー(Docker・Cloud Run・ECS)と Cloudflare Workers の両方でビルドできることを確かめる
      - run: pnpm build
      - run: pnpm build:cloudflare
